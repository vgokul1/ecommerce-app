<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Task Manager</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>

  <header>
    <h1>Task Manager</h1>
    <div id="user-info" class="hidden">
      <span id="welcome-msg"></span>
      <button id="logout-btn">Log Out</button>
    </div>
  </header>

  <!-- Login / Register screen -->
  <section id="auth-section">
    <div class="auth-box">
      <div class="auth-tabs">
        <button id="show-login" class="active">Log In</button>
        <button id="show-register">Sign Up</button>
      </div>

      <form id="login-form">
        <input type="email" id="login-email" placeholder="Email" required />
        <input type="password" id="login-password" placeholder="Password" required />
        <button type="submit">Log In</button>
        <p class="error" id="login-error"></p>
      </form>

      <form id="register-form" class="hidden">
        <input type="text" id="register-name" placeholder="Full Name" required />
        <input type="email" id="register-email" placeholder="Email" required />
        <input type="password" id="register-password" placeholder="Password (min 6 chars)" required />
        <button type="submit">Sign Up</button>
        <p class="error" id="register-error"></p>
      </form>
    </div>
  </section>

  <!-- Task dashboard (shown after login) -->
  <section id="task-section" class="hidden">
    <form id="task-form">
      <input type="text" id="task-title" placeholder="Task title" required />
      <input type="text" id="task-description" placeholder="Description (optional)" />
      <button type="submit">Add Task</button>
    </form>

    <div id="task-columns">
      <div class="column">
        <h3>Pending</h3>
        <div class="task-list" id="pending-list"></div>
      </div>
      <div class="column">
        <h3>In Progress</h3>
        <div class="task-list" id="inprogress-list"></div>
      </div>
      <div class="column">
        <h3>Done</h3>
        <div class="task-list" id="done-list"></div>
      </div>
    </div>
  </section>

  <script src="/socket.io/socket.io.js"></script>
  <script src="script.js"></script>
</body>
</html>
